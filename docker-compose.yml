services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adapterflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adapterflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-adapterflow}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adapterflow} -d ${POSTGRES_DB:-adapterflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - adapterflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-adapterflow}:${POSTGRES_PASSWORD:-adapterflow_dev}@db:5432/${POSTGRES_DB:-adapterflow}"
      STORAGE_PATH: /app/storage
      BACKEND_CORS_ORIGINS: '["https://${DOMAIN:-flow.adapterco.com.br}","http://${DOMAIN:-flow.adapterco.com.br}","http://localhost:3099","http://localhost:3000","http://localhost:${FRONTEND_PORT:-3099}"]'
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - adapterflow

  adapterflow-web:
    container_name: adapterflow-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: "http://backend:8000"
      HOSTNAME: "0.0.0.0"
      PORT: "3099"
    expose:
      - "3099"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik9"
      - "traefik.http.routers.adapterflow-web-http.rule=Host(${DOMAIN:-flow.adapterco.com.br})"
      - "traefik.http.routers.adapterflow-web-http.entrypoints=http"
      - "traefik.http.routers.adapterflow-web-http.middlewares=https-redirect"
      - "traefik.http.routers.adapterflow-web.rule=Host(${DOMAIN:-flow.adapterco.com.br})"
      - "traefik.http.routers.adapterflow-web.entrypoints=https"
      - "traefik.http.routers.adapterflow-web.tls=true"
      - "traefik.http.routers.adapterflow-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.adapterflow-web.service=adapterflow-web"
      - "traefik.http.services.adapterflow-web.loadbalancer.server.port=3099"
    networks:
      - adapterflow
      - traefik9

volumes:
  postgres_data:
  backend_storage:

networks:
  adapterflow:
    driver: bridge
  traefik9:
    external: true
