name: Quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: adapterflow_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d adapterflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/adapterflow_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/adapterflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app --select F
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m app.export_openapi
      - run: git diff --exit-code -- ../docs/openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx openapi-typescript ../docs/openapi.json -o types/api.generated.ts
      - run: git diff --exit-code -- types/api.generated.ts
      - run: npm run lint -- --max-warnings=0
      - run: node scripts/test-middleware.mjs
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          INTERNAL_BACKEND_URL: http://127.0.0.1:18080
      - run: node scripts/smoke-auth.mjs
      - run: node scripts/smoke-proxy.mjs
